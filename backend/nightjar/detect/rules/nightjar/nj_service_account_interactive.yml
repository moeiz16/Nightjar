title: Service account used for an interactive or remote-desktop sign-in
id: 773262e0-3dfb-54d2-8086-21c7ec65fea4
status: test
description: An account reserved for software services signed in interactively or over remote desktop.
author: Nightjar
tags: [attack.defense-evasion, attack.persistence, attack.t1078.002]

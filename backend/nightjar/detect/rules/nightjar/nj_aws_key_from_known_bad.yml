title: Cloud call with an access key from a flagged address
id: 2d0d5d38-1c41-5d8e-9f0e-6a1b2c3d4e01
name: nj_key_call_flagged_ip
status: stable
description: One cloud API call made with an access key from an address listed by threat intelligence. Feeds the correlation below; never alerts alone.
author: Nightjar
tags: [attack.initial-access, attack.t1078.004]
logsource: {product: aws, service: cloudtrail}
detection:
  selection:
    cloud.access_key_id|startswith: [AKIA, ASIA]
    threat.indicator.verdict: [malicious, suspicious]
  condition: selection
level: informational
---
title: Cloud access key used from a flagged address
id: 5fc58078-eb62-5b2c-9a6e-a9d6d3ed0209
status: stable
description: A cloud access key was used from an address listed by threat intelligence (one alert per key, address and half hour).
author: Nightjar
correlation:
  type: event_count
  rules: [nj_key_call_flagged_ip]
  group-by: [cloud.access_key_id, source.ip]
  timespan: 30m
  condition: {gte: 1}
tags: [attack.initial-access, attack.t1078.004]
level: high

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nightjar-soc"
version = "0.1.0"
description = "Nightjar SOC: AI security operations for mid-size companies, with regulatory incident clocks (NIS2, SEC Form 8-K Item 1.05, SOCI)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Moeiz Shahzad" }]
# Exact pins; the full resolved set is frozen in requirements.lock (make lock).
dependencies = [
  # web + platform (builder A)
  "fastapi==0.162.7",
  "uvicorn[standard]==0.54.0",
  "sse-starlette==3.7.0",
  "python-multipart==0.0.33",
  "orjson==3.13.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "email-validator==2.3.0",
  "SQLAlchemy[asyncio]==2.1.8",
  "aiosqlite==0.22.1",
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "httpx==0.28.1",
  "typer==0.29.1",
  # event backbone (ADR 0001)
  "nats-py==2.16.0",
  # agents and tools (ADR 0002)
  "a2a-sdk[http-server]==1.3.0",
  "mcp==2.3.0",
  # detection (ADR 0003)
  "pySigma==2.1.0",
  "PyYAML==6.0.3",
  # hunting store (ADR 0004); pytz: DuckDB returns TIMESTAMPTZ via pytz
  "duckdb==2.0.0",
  "pytz==2026.6",
  # classical ML (ADR 0005)
  "numpy==2.5.4",
  "pandas==3.1.1",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "shap==0.54.1",
  "optuna==5.0.0",
  "mlflow-skinny==3.18.0",
]

[project.optional-dependencies]
# Live agent narration through free cloud tiers. Not needed offline (LLM_FAKE=true is the default).
ai = ["litellm==1.109.1"]
# Optional production database.
postgres = ["asyncpg==0.32.0"]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "types-PyYAML==6.0.12.20261113",
]

[project.scripts]
nightjar = "nightjar.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["nightjar*"]

[tool.setuptools.package-data]
nightjar = [
  "**/data/*.json", "**/data/*.jsonl", "**/data/*.yml", "**/data/*.yaml",
  "detect/rules/**/*.yml",
  "workers/replay/*.gz", "workers/replay/*.json",
  "ml/artifacts/*",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "N", "C4"]
ignore = ["S101", "B008", "RUF012", "RUF001", "RUF002", "RUF003", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PT011", "PT018", "E501"]
"**/ml/**" = ["N803", "N806"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: model training or large replays (deselect with -m 'not slow')",
  "nats: needs the nats-server binary in .tools/ (skipped when absent)",
]
filterwarnings = ["ignore::DeprecationWarning:mlflow.*", "ignore::FutureWarning:mlflow.*"]
